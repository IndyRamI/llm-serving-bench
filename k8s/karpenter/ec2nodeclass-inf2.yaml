# EC2NodeClass for inf2 (AWS Inferentia2) nodes.
#
# CAVEAT: Inferentia2 support is more fragile than the g5/NVIDIA path and is
# provided here as best-effort scaffolding, not a verified/tested config:
#   - The EKS-optimized accelerated AMI (`al2@latest` alias) has historically
#     bundled the Neuron driver alongside NVIDIA drivers, but confirm this
#     against current AWS EKS AMI release notes for your chosen
#     kubernetes_version before relying on it — if it doesn't, you'll need
#     an explicit AMI id/SSM parameter for a Neuron-enabled AMI instead.
#   - The serving image must be built from vLLM's Neuron backend
#     (Dockerfile.neuron in the vLLM repo) with a transformers-neuronx /
#     neuronx-distributed version matched to your vLLM version — this is
#     version-sensitive and changes frequently. See k8s/vllm/deployment-inf2-neuron.yaml.
#
# NOTE: replace REPLACE_ME_NODE_ROLE_NAME and REPLACE_ME_CLUSTER_NAME as in ec2nodeclass-g5.yaml.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: inf2-neuron
spec:
  amiFamily: AL2
  role: REPLACE_ME_NODE_ROLE_NAME
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
  amiSelectorTerms:
    - alias: al2@latest # VERIFY: confirm this AMI includes Neuron SDK/driver for your k8s version
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    karpenter.sh/discovery: REPLACE_ME_CLUSTER_NAME
    hardware-pool: inf2-neuron
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: inf2-neuron
spec:
  template:
    metadata:
      labels:
        hardware-pool: inf2-neuron
        bench.io/gpu-family: inf2
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: inf2-neuron
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["inf2"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "8xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: aws.amazon.com/neuron
          value: "true"
          effect: NoSchedule
      expireAfter: 12h
  limits:
    cpu: "64"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
