# Config for running the harness as an in-cluster Job (k8s/bench-job.yaml),
# hitting vLLM Services directly via cluster DNS instead of port-forward.
prompts_file: configs/prompts.txt

targets:
  - name: llama3-8b-g5
    base_url: http://vllm-g5.default.svc.cluster.local:8000
    model: meta-llama/Meta-Llama-3-8B-Instruct
    hardware_label: g5.xlarge (A10G 24GB)

  - name: llama3-8b-inf2
    base_url: http://vllm-inf2.default.svc.cluster.local:8000
    model: meta-llama/Meta-Llama-3-8B-Instruct
    hardware_label: inf2.xlarge (Inferentia2)

load:
  concurrency_levels: [1, 4, 8, 16, 32]
  requests_per_level: 40
  max_tokens: 256
  temperature: 0.0
  request_timeout_s: 120
  warmup_requests: 5
